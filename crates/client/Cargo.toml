[package]
name = "danse-client"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
shroud = { path = "../shroud", features = ["native"] }
curve25519-dalek = { version = "4", features = ["rand_core"] }
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
hex = "0.4"

[dev-dependencies]
